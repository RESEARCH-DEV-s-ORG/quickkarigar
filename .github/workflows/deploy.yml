name: QuickKarigar Backend Deployment

"on":
  push:
    branches:
      - feature/backend-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout Repository ----------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------- Create Deployment Directory ----------
      - name: Create Remote Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p ~/quickkarigar/backend

      # ---------- Upload Files To VPS ----------
      - name: Upload Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend-api/*,docker-compose.yml,nginx.conf"
          target: ~/quickkarigar/backend

      # ---------- Deploy Application ----------
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/quickkarigar/backend

            echo "Creating production .env file..."

            cat > .env <<'EOF'
            NODE_ENV=production
            PORT=5000

            MONGODB_URI=${{ secrets.MONGODB_URI }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

            TRUECALLER_CLIENT_ID=${{ secrets.TRUECALLER_CLIENT_ID }}
            TRUECALLER_CLIENT_SECRET=${{ secrets.TRUECALLER_CLIENT_SECRET }}

            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}

            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_EMAIL=${{ secrets.SMTP_EMAIL }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}

            SMS_API_KEY=${{ secrets.SMS_API_KEY }}
            EOF

            echo "Stopping old containers..."
            docker compose down || true

            echo "Building latest containers..."
            docker compose build --no-cache

            echo "Starting services..."
            docker compose up -d

            echo "Cleaning unused Docker images..."
            docker image prune -af

            echo "Deployment completed successfully!"

            echo "Running containers:"
            docker ps