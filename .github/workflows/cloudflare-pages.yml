name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - feature/user-app
    paths:
      - 'web-user-app/**'
      - '.github/workflows/cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-user-app/package-lock.json

      - name: Install dependencies
        working-directory: web-user-app
        run: npm ci

      - name: Build Vite app
        working-directory: web-user-app
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v6
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=quickkarigar-web
          workingDirectory: web-user-app