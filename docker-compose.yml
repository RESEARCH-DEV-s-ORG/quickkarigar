version: "3.9"

services:
  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile

    container_name: quickkarigar-custom-backend

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "5000"

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - quickkarigar-network

  nginx:
    image: nginx:stable-alpine

    container_name: quickkarigar-nginx

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - quickkarigar-network

networks:
  quickkarigar-network:
    driver: bridge